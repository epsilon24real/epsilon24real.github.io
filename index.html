<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epsilon 24</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(120, 180, 255, 0.14), transparent 60%),
      radial-gradient(900px 500px at 90% 0%, rgba(120, 255, 210, 0.10), transparent 58%),
      linear-gradient(180deg, #171a1f 0%, #111419 100%);
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(24px, 6vw, 60px) clamp(16px, 5vw, 40px);
    text-align: center;
  }

  .content {
    width: 100%;
    max-width: 800px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: clamp(16px, 4vw, 28px);
    backdrop-filter: blur(2px);
  }

  h2 {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 700;
    margin-bottom: 24px;
    letter-spacing: -0.01em;
  }

  img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
    margin: 0 0 28px;
    object-fit: cover;
  }

  .tagline {
    font-size: clamp(1.2rem, 2.8vw, 1.5rem);
    font-weight: 600;
    margin-bottom: 16px;
    line-height: 1.4;
  }

  .sub-tagline {
    font-size: clamp(1.0rem, 2.2vw, 1.15rem);
    font-weight: 700;
    color: #d7d7d7;
    margin-top: -4px;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .description {
    font-size: clamp(1.05rem, 2.2vw, 1.25rem);
    color: #cccccc;
    margin-bottom: 36px;
    line-height: 1.7;
  }

  .footer-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 4px;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: #aaaaaa;
    margin-top: auto;
    padding-top: 24px;
  }

  a {
    color: #ffffff;
    text-decoration: underline;
    transition: opacity 0.2s ease;
  }

  a:hover {
    opacity: 0.7;
  }
</style>
<img src="epsilon-dmseriftext-logo-pure-cropped.svg" alt="Epsilon24 Logo" style="width: 110px; margin-top: 5px;">
</head>
<body>
<br><br>
<div class="content">  
  <p class="tagline">Interactive research tool to streamline navigation <br> of complex documents 🚀</p><br>
  <p class="description"></p>
  <p class="sub-tagline">We are currently running a closed Beta for early users,<br> more published soon ✨</p>
  <div class="footer-links">
    <a href="mailto:knowledge.systems.contact@gmail.com">Contact Us</a> &middot;
    <a id="privacy-link" href="./privacy.html">Privacy Policy</a> &middot;
    <a id="terms-link" href="./terms.html">Terms of Service</a>
  </div>
</div>
</body>
</html>
